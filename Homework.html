<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home work</title>
    <link rel="stylesheet" href="homework.css">
</head>
<body>
    
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo"> DashBoard</div>
            <nav class="nav-links">
                <a href="#" class="active">Overview</a>
                <a href="#">Analytics</a>
                <a href="#">Transactions</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <div class="main-body">
            <header class="header">
                <h2>Hello Keonho, here's your overview</h2>
                <div class="user-profile">
                    <span class="avatar">🐶</span>
                    <span class="username">Keonho</span>
                </div>
            </header>

            <main class="content">
                <section class="metrics-grid">
                    <div class="card">
                        <h3>Total Balance</h3>
                        <p class="value">$121,920</p>
                    </div>
                    <div class="card">
                        <h3>Total Users</h3>
                        <p class="value">89,121</p>
                    </div>
                    <div class="card">
                        <h3>New Leads</h3>
                        <p class="value">12,902</p>
                    </div>
                    <div class="card">
                        <h3>Growth Rate</h3>
                        <p class="value">+21.20%</p>
                    </div>
                </section>
                
                <section class="data-grid">
                    <div class="data-card main-chart">
                        <h3 class="card-title">Performance Chart</h3>
                        <div class="img-wrapper">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvM6flWjQknuQ1ZuogYvkpnFCrp95jqXO-4MIFJv8zsQ&s=10" alt="Performance Chart" class="dashboard-img">
                        </div>
                    </div>
                    <div class="data-card recent-activity">
                        <h3 class="card-title">Latest Transactions</h3>
                        <div class="img-wrapper">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9URpAGeBmwB_Dy8hdg9_Qj3KtNPV7Gte4-9BpXBw_6w&s=10" alt="Recent Transactions" class="dashboard-img">
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    
</body>
</html>
